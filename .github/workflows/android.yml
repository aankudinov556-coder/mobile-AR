name: Android (MAUI)

# Android-версия Веры (.NET MAUI): собирает APK и публикует его в релиз v<версия из Directory.Build.props>.
# Сейчас идёт работа только над ПК-версией — Android собирается лишь вручную (Actions → Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
        env:
          # своя папка — workload можно ставить без sudo
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ hashFiles('Vera.Mobile/*.csproj', 'Vera.Core/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-android-

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Read version
        id: ver
        run: |
          v=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Версия: $v"

      - name: Android SDK packages
        continue-on-error: true
        run: >
          dotnet build Vera.Mobile/Vera.Mobile.csproj -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          SIGN=()
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vera.keystore"
            SIGN=(-p:AndroidKeyStore=true "-p:AndroidSigningKeyStore=$RUNNER_TEMP/vera.keystore" "-p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS"
                  -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD)
            echo "SIGNED_WITH=release" >> "$GITHUB_ENV"
            echo "Подпись: ключ из секретов репозитория"
          else
            echo "SIGNED_WITH=debug" >> "$GITHUB_ENV"
            echo "::warning::Секреты ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS не заданы — APK подписан отладочным ключом (обновление поверх прошлой сборки может потребовать удаления)."
          fi
          dotnet publish Vera.Mobile/Vera.Mobile.csproj -f net10.0-android -c Release \
            -p:AndroidPackageFormat=apk -p:AndroidSdkDirectory="$ANDROID_HOME" "${SIGN[@]}"

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p out
          apk=$(find Vera.Mobile/bin/Release/net10.0-android -name '*-Signed.apk' | head -n 1)
          if [ -z "$apk" ]; then find Vera.Mobile/bin -name '*.apk'; echo "APK не найден"; exit 1; fi
          cp "$apk" "out/Vera-Android-${{ steps.ver.outputs.version }}.apk"
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vera-Android-${{ steps.ver.outputs.version }}
          path: out/Vera-Android-${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Вера v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: out/Vera-Android-${{ steps.ver.outputs.version }}.apk
          fail_on_unmatched_files: true
          overwrite_files: true
