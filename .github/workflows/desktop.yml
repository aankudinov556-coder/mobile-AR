name: Desktop (Windows, WPF)

# ПК-версия Веры (C#/WPF): тесты ядра, однофайловая портативная сборка (zip, без установщика).
# Публикует zip в пре-релиз v<версия из Directory.Build.props>.
# Установщик (Vera.Desktop/installer/vera.iss) сейчас не собирается — по запросу «только ПК-билд без установщика».
on:
  push:
    paths:
      - 'Vera.Desktop/**'
      - 'Vera.Core/**'
      - 'Vera.Core.Tests/**'
      - 'Vera.LocalAI/**'
      - 'Vera.LocalAI.Tests/**'
      - 'assets/**'
      - 'build/**'
      - 'Directory.Build.props'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-desktop-${{ hashFiles('Vera.Desktop/*.csproj', 'Vera.Core/*.csproj', 'Vera.Core.Tests/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-desktop-

      - name: Read version
        id: ver
        run: |
          $m = Select-String -Path Directory.Build.props -Pattern '<Version>([^<]+)</Version>' | Select-Object -First 1
          if (-not $m) { throw 'Version не найдена в Directory.Build.props' }
          $v = $m.Matches[0].Groups[1].Value.Trim()
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Версия: $v"

      - name: Tests (ядро + локальный ИИ)
        if: hashFiles('Vera.Core.Tests/*.csproj') != ''
        run: |
          dotnet test Vera.Core.Tests -c Release --logger "console;verbosity=normal"
          dotnet test Vera.LocalAI.Tests -c Release --logger "console;verbosity=normal"

      # Папка, а не один exe: нативные библиотеки llama.cpp / Whisper / Vosk / ONNX Runtime
      # должны лежать рядом с программой (runtimes\win-x64\...), иначе их не найти.
      - name: Publish (self-contained folder)
        run: >
          dotnet publish Vera.Desktop/Vera.Desktop.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=false
          -o out/Vera

      - name: Check native libraries
        run: |
          $need = @(
            'out/Vera/Vera.exe',
            'out/Vera/runtimes/win-x64/native/avx2/llama.dll',
            'out/Vera/runtimes/win-x64/whisper.dll',
            'out/Vera/libvosk.dll',
            'out/Vera/onnxruntime.dll',
            'out/Vera/assets/models/silero_vad.onnx'
          )
          $missing = $need | Where-Object { -not (Test-Path $_) }
          if ($missing) { Write-Error ("Нет файлов: " + ($missing -join ', ')); exit 1 }
          Get-ChildItem out/Vera/runtimes -Directory | Format-Table Name

      - name: Portable zip
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          Get-ChildItem out/Vera -Recurse -Filter *.pdb | Remove-Item
          Compress-Archive -Path out/Vera -DestinationPath "out/Vera-Portable-$v.zip" -Force
          Get-ChildItem out -File | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vera-Windows-${{ steps.ver.outputs.version }}
          path: out/Vera-Portable-${{ steps.ver.outputs.version }}.zip
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Вера v${{ steps.ver.outputs.version }} (ПК, портативная)
          target_commitish: ${{ github.sha }}
          prerelease: true
          body_path: docs/RELEASE_NOTES.md
          files: out/Vera-Portable-${{ steps.ver.outputs.version }}.zip
          fail_on_unmatched_files: true
          overwrite_files: true
